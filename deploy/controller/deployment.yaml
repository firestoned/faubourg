#
# The Host controller (ADR-0009). Two replicas, of which only the holder of the Lease
# faubourg-controller acts; the other waits to take over (ADR-0014). A rolling update is safe:
# a new pod only acts once the old leader has released the Lease or let it run out.
#
# Do not edit the image digests here: `make release-manifests` renders them, into this file and
# into the admission policy's parameters at once (ADR-0012 decision 5), and a release ships the
# result. The `<digest>` placeholders are not valid images, so an unrendered copy never runs.
# The operator sets FAUBOURG_PROVIDER_API_SERVER: the controller refuses to start without it.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: faubourg-controller
  namespace: faubourg-system
  labels:
    app.kubernetes.io/name: faubourg-controller
    app.kubernetes.io/component: host-controller
    app.kubernetes.io/managed-by: faubourg
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: faubourg-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: faubourg-controller
        app.kubernetes.io/component: host-controller
    spec:
      serviceAccountName: faubourg-controller
      enableServiceLinks: false
      # On different nodes where the cluster allows it, so one node's loss leaves a standby.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: faubourg-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/firestoned/faubourg-controller@sha256:<digest>
          env:
            # This replica's identity in the leader election (ADR-0014).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: FAUBOURG_BOOTSTRAP_IMAGE
              value: ghcr.io/firestoned/faubourg-bootstrap@sha256:<digest>
            - name: FAUBOURG_CREDENTIALS_NAMESPACE
              value: faubourg-credentials
            - name: FAUBOURG_BOOTSTRAP_SERVICE_ACCOUNT
              value: faubourg-bootstrap
            - name: FAUBOURG_DEFAULT_SCRIPT
              value: ConfigMap/faubourg-install
            - name: FAUBOURG_PROVIDER_NAMESPACE
              value: banlieue-system
            # At most this many re-bootstraps at once, across the cluster; a failed one halts
            # the rollout (ADR-0013).
            - name: FAUBOURG_MAX_REBOOTSTRAPS
              value: "1"
            # The API server address the hosts' providers use, https:// (ADR-0011).
            - name: FAUBOURG_PROVIDER_API_SERVER
              value: "" # rendered from PROVIDER_API_SERVER, or set by the operator
            - name: RUST_LOG
              value: info
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
