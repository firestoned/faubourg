#
# Namespaces, identities and RBAC for the Host controller and its bootstrap Jobs
# (ADR-0005, ADR-0006, ADR-0008 decision 6).
#
# The controller can create and delete Jobs in the credentials namespace and read Jobs and
# Pods there (for the termination message that carries ScriptDrift). It has nothing on
# Secrets, ConfigMaps, Pod subresources (exec, attach, port-forward) or the admission policy
# objects, anywhere. What its Jobs may contain is decided by the admission policy, not by
# this file. In banlieue's namespace it creates, labels and reads the hosts' Providers
# (ADR-0011 decision 7), and nothing else: it never mints a token. The bootstrap pods mint
# the first provider token there, bounded by the faubourg-provider-tokens policy.
# Rename `banlieue-system` below if banlieue runs elsewhere, and pass the same name as
# --provider-namespace.
---
apiVersion: v1
kind: Namespace
metadata:
  name: faubourg-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: faubourg-credentials
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: faubourg-controller
  namespace: faubourg-system
---
# The bootstrap pods' identity. Its only permission is TokenRequest in banlieue's namespace,
# for provider ServiceAccounts (ADR-0011); its token is never auto-mounted, only projected
# for 600 seconds into the kube-api volume.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: faubourg-bootstrap
  namespace: faubourg-credentials
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: faubourg-controller
rules:
  - apiGroups: ["faubourg.firestoned.io"]
    resources: ["hosts", "availabilityzones"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["faubourg.firestoned.io"]
    resources: ["hosts/status", "availabilityzones/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["banlieue.io"]
    resources: ["providerclasses"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: faubourg-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: faubourg-controller
subjects:
  - kind: ServiceAccount
    name: faubourg-controller
    namespace: faubourg-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: faubourg-controller-bootstrap
  namespace: faubourg-credentials
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: faubourg-controller-bootstrap
  namespace: faubourg-credentials
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: faubourg-controller-bootstrap
subjects:
  - kind: ServiceAccount
    name: faubourg-controller
    namespace: faubourg-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: faubourg-controller-providers
  namespace: banlieue-system
rules:
  - apiGroups: ["banlieue.io"]
    resources: ["providers"]
    verbs: ["get", "list", "watch", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: faubourg-controller-providers
  namespace: banlieue-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: faubourg-controller-providers
subjects:
  - kind: ServiceAccount
    name: faubourg-controller
    namespace: faubourg-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: faubourg-bootstrap-provider-tokens
  namespace: banlieue-system
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: faubourg-bootstrap-provider-tokens
  namespace: banlieue-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: faubourg-bootstrap-provider-tokens
subjects:
  - kind: ServiceAccount
    name: faubourg-bootstrap
    namespace: faubourg-credentials
