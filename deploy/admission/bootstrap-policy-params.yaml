#
# Parameters for the bootstrap admission policy (ADR-0008 decision 2). Lives in
# faubourg-system, not in the credentials namespace, so a script maintainer (who writes
# ConfigMaps there) cannot change the image or the allowlist. The controller has no ConfigMap
# write anywhere. A platform administrator edits this.
#
#   image               the bootstrap image, pinned by digest: rendered by
#                       `make release-manifests` (ADR-0012), never edited by hand
#   serviceAccountName  the bootstrap pods' ServiceAccount (TokenRequest on provider
#                       ServiceAccounts only, ADR-0011)
#   scriptSources       comma-separated, no spaces: <Kind>/<name>/<key>@sha256:<64 hex>, Kind
#                       ConfigMap or Secret. The digest is the sha256 of exactly the file the
#                       source was created from (`sha256sum install.sh`). A Job runs only a
#                       pinned script; re-pinning re-bootstraps every Host using it, one at a
#                       time (ADR-0013). The placeholder below matches no script, so nothing
#                       bootstraps until you pin yours.
#   providerCASource    optional: ConfigMap/<name>/<key>@sha256:<64 hex>, the PEM bundle the
#                       hosts trust for the API server when they reach it under another
#                       certificate than the cluster's (a load balancer). Empty: the cluster
#                       CA. Changing it re-bootstraps every Host, one at a time (ADR-0016).
#   providerServiceAccountPrefix
#                       the only ServiceAccounts a bootstrap pod may mint a token for:
#                       banlieue-provider-<class>- (ADR-0011 decision 8)
#   apiAudiences        comma-separated: the API server's own token audiences, the only ones
#                       a provider token may carry. kubeadm and kind default to the one
#                       below; check `--api-audiences` (or the issuer) on other distributions.
apiVersion: v1
kind: ConfigMap
metadata:
  name: faubourg-bootstrap-policy
  namespace: faubourg-system
data:
  image: "ghcr.io/firestoned/faubourg-bootstrap@sha256:<digest>"
  serviceAccountName: faubourg-bootstrap
  scriptSources: "ConfigMap/faubourg-install/install.sh@sha256:<your-script-sha256>"
  providerCASource: ""
  providerServiceAccountPrefix: "banlieue-provider-cloud-hypervisor-"
  apiAudiences: "https://kubernetes.default.svc.cluster.local"
