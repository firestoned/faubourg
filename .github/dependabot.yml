#
# Dependency update automation (Scorecard Dependency-Update-Tool). Weekly, and
# every ecosystem carries a 7-day cooldown: Dependabot waits after a version is
# published before proposing it, the standard defence against a compromised
# release being auto-merged within hours of publication.

version: 2
updates:
  # GitHub Actions: keeps the SHA-pinned actions current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Rust crates.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # kube and k8s-openapi move as a unit, and in step with banlieue-api
      # (Cargo.toml explains why two kube majors in one graph break the build).
      # Declared first: a dependency joins the first group that matches it.
      kube-ecosystem:
        patterns: ["kube", "kube-*", "k8s-openapi"]
      # Everything else in one PR. Majors are included deliberately: cargo
      # treats a 0.x -> 0.y bump as major, so a minor/patch-only group would
      # leave most pre-1.0 crates as individual PRs.
      cargo:
        patterns: ["*"]
        exclude-patterns: ["kube", "kube-*", "k8s-openapi"]

  # Documentation toolchain (pyproject.toml / poetry.lock).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docs:
        patterns: ["*"]
