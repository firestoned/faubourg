#
# faubourg documentation, MkDocs Material. The source is the existing docs/
# tree in place (docs_dir below), so the paths the project rules reference
# (docs/adr, docs/security/threat-model.md, docs/architecture) stay canonical.

site_name: faubourg, availability zones for banlieue
site_url: https://firestoned.github.io/faubourg/
site_description: >-
  A control plane that groups bare-metal Cloud Hypervisor hosts into availability
  zones for banlieue, and bootstraps new hosts with one root-owned install script.
site_author: Erick Bourgeois

repo_url: https://github.com/firestoned/faubourg
repo_name: firestoned/faubourg
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# CALM sources are architecture-as-code inputs, not pages; the rendered
# Mermaid diagrams under docs/architecture/diagrams/ are the published half.
exclude_docs: |
  architecture/calm/

copyright: Copyright &copy; 2026 Erick Bourgeois

theme:
  name: material
  language: en
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - git-revision-date-localized:
      # Creation dates stay off: a page that is new in the working tree has no
      # git log yet, and the plugin's creation-date probe warns on it, which
      # would fail the --strict build (kept for its broken-link checking).
      enable_creation_date: false
      type: timeago
      fallback_to_build_date: true
      enable_git_follow: false
      strict: false

markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      toc_depth: 3
  # PyMdown Extensions
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/firestoned/faubourg
      name: faubourg on GitHub
  generator: true

nav:
  - Home: index.md
  - Concepts: concepts.md
  - Guides:
      - Installing: guides/installing.md
      - Preparing a host: guides/preparing-a-host.md
      - SSH credentials: guides/ssh-credentials.md
      - Placing VMs in a zone: guides/zone-placement.md
  - Reference:
      - API: reference/api.md
      - Examples: reference/examples.md
  - Architecture:
      - System: architecture/diagrams/system.md
      - Flows: architecture/diagrams/flows.md
      - Original design sketch: design-sketch.md
  - ADRs:
      - Index: adr/README.md
      - "ADR-0001: Record architecture decisions": adr/0001-record-architecture-decisions.md
      - "ADR-0002: banlieue's provider is the host agent": adr/0002-banlieue-provider-is-the-host-agent.md
      - "ADR-0003: AvailabilityZone and Host CRDs": adr/0003-availabilityzone-and-host-crds.md
      - "ADR-0004: v1 local storage only": adr/0004-v1-local-storage-only.md
      - "ADR-0005: One scoped install script": adr/0005-bootstrap-runs-one-scoped-install-script.md
      - "ADR-0006: SSH credentials": adr/0006-ssh-credentials.md
      - "ADR-0007: Health from the banlieue Provider": adr/0007-health-from-the-banlieue-provider.md
      - "ADR-0008: Bootstrap Jobs under an admission policy": adr/0008-bootstrap-jobs-constrained-by-admission-policy.md
      - "ADR-0009: The Host reconciler": adr/0009-host-reconciler.md
      - "ADR-0010: The bootstrap image": adr/0010-bootstrap-image.md
      - "ADR-0011: The host's Provider and its identity": adr/0011-the-hosts-provider-and-its-identity.md
      - "ADR-0012: Images signed and published by digest": adr/0012-images-signed-and-published-by-digest.md
  - Security:
      - Threat model: security/threat-model.md
  - Development: development.md
